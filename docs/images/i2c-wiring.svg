<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">One software I2C bus, multiple independent modules</title>
  <desc id="desc">STC89C52RC GPIO P1.6 SDA and P1.7 SCL connect to SSD1306 at 0x3C, PCF8591 at 0x49 and MPU6050 at 0x68. This is a wiring diagram, not an in-game screenshot.</desc>
  <rect width="1200" height="390" rx="20" fill="#101c24"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="40" y="48" fill="#f4f5e8" font-size="26" font-weight="700">YOUR GPIO. YOUR CIRCUIT.</text>
    <text x="40" y="76" fill="#9ab3be" font-size="15">Named terminals / software I²C / independent peripherals</text>
    <g fill="#192e38" stroke="#45616c" stroke-width="1.5">
      <rect x="40" y="121" width="235" height="200" rx="12"/>
      <rect x="360" y="121" width="235" height="130" rx="12"/>
      <rect x="645" y="121" width="235" height="130" rx="12"/>
      <rect x="930" y="121" width="230" height="130" rx="12"/>
    </g>
    <g fill="#f4f5e8" font-size="22" font-weight="600">
      <text x="60" y="158">STC89C52RC</text><text x="380" y="158">SSD1306 OLED</text>
      <text x="665" y="158">PCF8591</text><text x="950" y="158">MPU6050</text>
    </g>
    <g fill="#9ab3be" font-size="16">
      <text x="60" y="185">8 KiB Flash / 256 B IDATA</text>
      <text x="380" y="187">128 × 64 display</text><text x="380" y="217">Address 0x3C</text>
      <text x="665" y="187">4 × ADC / 1 × DAC</text><text x="665" y="217">Set address to 0x49</text>
      <text x="950" y="187">Acceleration / gyro</text><text x="950" y="217">Address 0x68</text>
    </g>
    <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M275 225H315V283H1018V251 M448 251V283 M733 251V283" stroke="#6ad7cf"/>
      <path d="M275 266H297V308H1060V251 M490 251V308 M775 251V308" stroke="#edb85f"/>
    </g>
    <g fill="#6ad7cf"><circle cx="448" cy="283" r="4"/><circle cx="733" cy="283" r="4"/></g>
    <g fill="#edb85f"><circle cx="490" cy="308" r="4"/><circle cx="775" cy="308" r="4"/></g>
    <text x="60" y="231" fill="#6ad7cf" font-size="19">P1.6 → SDA</text>
    <text x="60" y="272" fill="#edb85f" font-size="19">P1.7 → SCL</text>
    <text x="40" y="359" fill="#9ab3be" font-size="15">7-bit bus addresses · PCF8591 default: 0x48 · Different addresses can share the same SDA / SCL pair</text>
  </g>
</svg>
